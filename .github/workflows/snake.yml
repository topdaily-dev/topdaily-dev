name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: topdaily-dev
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Publish snake to output branch folder
        run: |
          mkdir -p output
          cp dist/snake.svg output/snake.svg
          cp dist/snake-dark.svg output/snake-dark.svg

      - uses: EndBug/add-and-commit@v9
        with:
          author_name: topdaily-dev
          author_email: 315340167+topdaily-dev@users.noreply.github.com
          message: "chore: update contribution snake"
          add: output
